@keyframes drift{from{transform:translate3d(-5%,0,0)}to{transform:translate3d(5%,0,0)}}

@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.9)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div ref="{{ journeyRef }}" style="position:relative;height:600vh;background:#f5f0e7">

            <div style="position:absolute;left:18%;right:5%;top:63%;height:8%;background:radial-gradient(ellipse 36% 50% at 40% 50%,rgba(255,252,248,.42),transparent 70%),radial-gradient(ellipse 28% 45% at 80% 45%,rgba(255,250,244,.38),transparent 70%);animation:drift 32s ease-in-out infinite alternate-reverse"></div>

          <div data-l="right" style="position:absolute;inset:0;background:url(assets/hero-valley.png) 0 0/100% 100% no-repeat;-webkit-mask-image:radial-gradient(ellipse 26% 62% at 100% 80%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 26% 62% at 100% 80%,#000 55%,transparent 100%);transform-origin:47% 68%;will-change:transform">
            </div>
          <div data-l="left" style="position:absolute;inset:0;background:url(assets/hero-valley.png) 0 0/100% 100% no-repeat;-webkit-mask-image:linear-gradient(90deg,#000 9%,transparent 20%);mask-image:linear-gradient(90deg,#000 9%,transparent 20%);transform-origin:47% 68%;will-change:transform">
            </div>

        <div data-l="hot" style="position:absolute;inset:0">

      <div data-puff="2" style="position:absolute;left:55%;top:60%;width:76vmax;height:40vmax;margin:-20vmax 0 0 -38vmax;border-radius:50%;background:radial-gradient(ellipse at center,rgba(252,249,245,.95) 0%,rgba(248,245,241,.6) 35%,rgba(248,245,241,0) 70%);opacity:0;will-change:transform,opacity"></div>
      <div data-puff="3" style="position:absolute;left:55%;top:60%;width:64vmax;height:36vmax;margin:-18vmax 0 0 -32vmax;border-radius:50%;background:radial-gradient(ellipse at center,rgba(246,247,246,.95) 0%,rgba(242,244,243,.6) 35%,rgba(242,244,243,0) 70%);opacity:0;will-change:transform,opacity"></div>

          <button onClick="{{ goStory }}" aria-label="01 Our story" style="position:absolute;left:23.38%;top:55.19%;width:7.68%;height:8.56%;appearance:none;border:0;background:transparent;cursor:pointer;border-radius:8px;transition:background .4s ease" style-hover="background:rgba(255,248,236,.28)"></button>

          <button onClick="{{ goEvents }}" aria-label="03 Events" style="position:absolute;left:47.10%;top:55.19%;width:6.49%;height:8.56%;appearance:none;border:0;background:transparent;cursor:pointer;border-radius:8px;transition:background .4s ease" style-hover="background:rgba(255,248,236,.28)"></button>

</section>

    <div style="position:absolute;left:64.23%;top:44.00%;width:6.7%;height:7.80%;display:flex;align-items:center;justify-content:center"><div style="position:absolute;inset:0;background:#f9e7d4;border-radius:10%;filter:blur(3px)"></div><span style="position:relative;font-family:'Bodoni Moda',serif;font-weight:400;font-size:4.2cqw;line-height:1;color:#1c2a26;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.01em" data-cd="cdS">{{ cdS }}</span></div>

    <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;background:url(assets/families.png) 0 0/100% 100% no-repeat;-webkit-mask-image:radial-gradient(ellipse 7.4% 21.5% at 16% 43%,#000 82%,transparent 100%),radial-gradient(ellipse 7.8% 21.5% at 85.5% 43%,#000 82%,transparent 100%);mask-image:radial-gradient(ellipse 7.4% 21.5% at 16% 43%,#000 82%,transparent 100%),radial-gradient(ellipse 7.8% 21.5% at 85.5% 43%,#000 82%,transparent 100%);transform:translateZ(0)"></div>

    const L=[['[data-sx="plaque"]',1433/1098,.5],['section[data-screen-label="Countdown"] > div',1672/859,.5],['section[data-screen-label="Introducing the Families"] > div',16/9,.5],['section[data-screen-label="Travel"] > div',16/9,.28],['[data-sched]',16/9,.5],['[data-story]',1659/948,.55],['section[data-screen-label="RSVP"] > div',1667/943,.5]];
    for(const [sel,r,focus] of L){const el=document.querySelector(sel);if(!el)continue;const sec=el.closest('section');
      if(mob){const h=Math.round(Math.min(vh*.8,640)),w=Math.max(vw,Math.round(h*r));if(!(w>0))continue;
        if(el.style.width!==w+'px'){el.dataset.mf='1';el.style.width=w+'px';el.style.flex='none';
          Object.assign(sec.style,{overflowX:'auto',overflowY:'hidden',scrollbarWidth:'none',webkitOverflowScrolling:'touch',overscrollBehaviorX:'contain',justifyContent:'flex-start'});
          requestAnimationFrame(()=>{sec.scrollLeft=Math.max(0,(w-vw)*focus);});}}
      else if(el.dataset.mf){delete el.dataset.mf;el.style.width='100%';el.style.flex='';Object.assign(sec.style,{overflowX:'',overflowY:'',scrollbarWidth:'',overscrollBehaviorX:'',justifyContent:''});}}
    const ft=document.querySelector('footer[data-screen-label="Footer"]');if(ft)ft.style.padding=mob?'24px 0':'';
  }
  goTo(label){const s=document.querySelector('[data-screen-label="'+label+'"]');if(!s)return;this.auto=null;const y=s.getBoundingClientRect().top+window.scrollY;window.scrollTo({top:y,behavior:this.reduced?'auto':'smooth'});}
  getAudio(){if(!this.audio){const au=new Audio('assets/heeriye-flute.mp3');au.loop=true;au.preload='auto';au.volume=0;this.audio=au;}return this.audio;}
  fadeAudio(to,ms,done){const au=this.getAudio();cancelAnimationFrame(this._fadeR);const from=au.volume,t0=performance.now();
    const step=now=>{const k=Math.min(1,(now-t0)/ms);au.volume=Math.max(0,Math.min(1,from+(to-from)*k));if(k<1)this._fadeR=requestAnimationFrame(step);else if(done)done();};this._fadeR=requestAnimationFrame(step);}
  startMusic(){const au=this.getAudio();const p=au.play();if(p&&p.catch)p.catch(()=>{this.musicOn=false;this.syncMusic();});this.fadeAudio(.7,1500);}
  stopMusic(){if(!this.audio)return;this.fadeAudio(0,700,()=>{if(!this.musicOn)this.audio.pause();});}
  setMusic(on){this.musicOn=on;if(on)this.startMusic();else this.stopMusic();this.syncMusic();}
  syncMusic(){const on=!!this.musicOn;document.querySelectorAll('[data-music]').forEach(b=>{b.setAttribute('aria-pressed',String(on));const l=b.querySelector('[data-ml]');if(l)l.textContent=on?'Pause Music':'Play Music';});
    const fb=document.querySelector('[data-musicfab]');if(fb&&this._musicStarted){fb.style.opacity='1';fb.style.pointerEvents='auto';}
    document.querySelectorAll('[data-mbars]').forEach(el=>el.style.opacity=on?'1':'0');document.querySelectorAll('[data-mplay]').forEach(el=>el.style.opacity=on?'0':'1');}
  toggleMusic(){this._musicStarted=true;this.setMusic(!this.musicOn);}
  pickTravel(k){
    this.travelMode=k;
    document.querySelectorAll('section[data-screen-label="Travel"] button[aria-pressed]').forEach(b=>b.setAttribute('aria-pressed',String(b.getAttribute('aria-label').toLowerCase()==='by '+k)));
    document.querySelectorAll('section[data-screen-label="Travel"] video[data-tv]').forEach(v=>{v.style.opacity=v.dataset.tv===k?'1':'0';});
    document.querySelectorAll('section[data-screen-label="Travel"] video[data-tv]').forEach(v=>{v.muted=true;v.volume=0;v.loop=true;v.playsInline=true;
      if(v.dataset.tv===k){try{v.currentTime=0;}catch(e){}if(!this.reduced)v.play().catch(()=>{});}else setTimeout(()=>{if(this.travelMode!==v.dataset.tv)v.pause();},1200);});
  }
  renderVals(){
    const ms=Math.max(0,Date.parse('2028-09-25T00:00:00+05:30')-(this.state&&this.state.now||Date.now())),p2=n=>String(n).padStart(2,'0');
    return {
      cdD:String(Math.floor(ms/864e5)), cdH:p2(Math.floor(ms/36e5)%24), cdM:p2(Math.floor(ms/6e4)%60), cdS:p2(Math.floor(ms/1e3)%60),
      ...this.travelVals(),
      goStory:()=>this.goTo('Our Story'),goJourney:()=>this.goTo('Travel'),goEvents:()=>this.goTo('Schedule of Events'),goGallery:()=>this.goTo('Introducing the Families'),goRsvp:()=>this.goTo('RSVP'),toggleMusic:()=>this.toggleMusic(),
      journeyRef:this.journeyRef, stageRef:this.stageRef, scratchRef:this.scratchRef, replay:()=>this.replayReveal&&this.replayReveal(),
      enter:()=>{this._musicStarted=true;if(!this.musicOn)this.setMusic(true);const j=this.journeyRef.current,top=j.getBoundingClientRect().top+window.scrollY,end=top+j.offsetHeight-window.innerHeight;
        if(this.reduced){window.scrollTo(0,end);return;}
        const y0=window.scrollY,frac=1-cl((y0-top)/(end-top));
        this.auto={t0:performance.now(),y0,y1:end,dur:Math.max(1500,(this.props.autoplaySeconds||9)*1000*frac)};}
    };
  }
}
